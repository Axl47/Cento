<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="Song audio goes through Stemma for sound vectors, stems, tempo, key, mood and lyrics. Cento combines that with Spotify history into the suggestion model, sound map, lyric themes and play counts, which feed the Sort, Sound map and Library views screens. Segue reads the sound data and reports plays and ratings back to Cento.">
<style>
svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.bg{fill:#ffffff}.grp{fill:#f6f8fa;stroke:#d0d7de}.box{fill:#ffffff;stroke:#afb8c1}
.t{fill:#1f2328;font-size:14px;font-weight:600;text-anchor:middle}
.s{fill:#59636e;font-size:11.5px;text-anchor:middle}
.g{font-size:12px;font-weight:700;letter-spacing:.02em;fill:#59636e}
.g.st{fill:#8250df}.g.ce{fill:#0969da}.grp.st{stroke:#c297ff}.grp.ce{stroke:#54aeff}
.l{fill:#59636e;font-size:11.5px;text-anchor:middle}
.ln{fill:none;stroke:#8c959f;stroke-width:1.5}.dash{stroke-dasharray:5 4}#a path{fill:#8c959f}
@media (prefers-color-scheme:dark){
.bg{fill:#0d1117}.grp{fill:#161b22;stroke:#30363d}.box{fill:#0d1117;stroke:#484f58}
.t{fill:#e6edf3}.s,.g,.l{fill:#9198a1}.g.st{fill:#bc8cff}.g.ce{fill:#58a6ff}
.grp.st{stroke:#6e40c9}.grp.ce{stroke:#1f6feb}.ln{stroke:#6e7681}#a path{fill:#6e7681}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="960" height="420" rx="12"/>
<rect class="grp in" x="20" y="40" width="180" height="270" rx="12"/>
<text class="g in" x="34" y="62">Inputs</text>
<rect class="box" x="36" y="96" width="148" height="52" rx="8"/>
<text class="t" x="110.0" y="119.0">Spotify</text><text class="s" x="110.0" y="135.0">library + 10 years of plays</text>
<rect class="box" x="36" y="200" width="148" height="44" rx="8"/>
<text class="t" x="110.0" y="227.0">Song audio</text>
<rect class="grp st" x="240" y="40" width="220" height="270" rx="12"/>
<text class="g st" x="254" y="62">Stemma · Python</text>
<rect class="box" x="256" y="72" width="188" height="46" rx="8"/>
<text class="t" x="350.0" y="92.0">Sound vectors</text><text class="s" x="350.0" y="108.0">Discogs-EffNet</text>
<rect class="box" x="256" y="130" width="188" height="46" rx="8"/>
<text class="t" x="350.0" y="150.0">Stems</text><text class="s" x="350.0" y="166.0">Demucs</text>
<rect class="box" x="256" y="188" width="188" height="46" rx="8"/>
<text class="t" x="350.0" y="216.0">Tempo, key, mood</text>
<rect class="box" x="256" y="246" width="188" height="46" rx="8"/>
<text class="t" x="350.0" y="274.0">Lyrics</text>
<rect class="grp ce" x="500" y="40" width="240" height="270" rx="12"/>
<text class="g ce" x="514" y="62">Cento · TypeScript</text>
<rect class="box" x="516" y="72" width="208" height="46" rx="8"/>
<text class="t" x="620.0" y="92.0">Suggestion model</text><text class="s" x="620.0" y="108.0">artist + nearest songs + classifier</text>
<rect class="box" x="516" y="130" width="208" height="46" rx="8"/>
<text class="t" x="620.0" y="150.0">Sound map</text><text class="s" x="620.0" y="166.0">UMAP</text>
<rect class="box" x="516" y="188" width="208" height="46" rx="8"/>
<text class="t" x="620.0" y="208.0">Lyric themes</text><text class="s" x="620.0" y="224.0">E5 embeddings</text>
<rect class="box" x="516" y="246" width="208" height="46" rx="8"/>
<text class="t" x="620.0" y="274.0">Play counts, eras</text>
<rect class="grp sc" x="780" y="40" width="160" height="270" rx="12"/>
<text class="g sc" x="794" y="62">Screens</text>
<rect class="box" x="796" y="90" width="128" height="44" rx="8"/>
<text class="t" x="860.0" y="117.0">Sort</text>
<rect class="box" x="796" y="154" width="128" height="44" rx="8"/>
<text class="t" x="860.0" y="181.0">Sound map</text>
<rect class="box" x="796" y="218" width="128" height="44" rx="8"/>
<text class="t" x="860.0" y="245.0">Library views</text>
<rect class="box" x="400" y="346" width="160" height="52" rx="8"/>
<text class="t" x="480.0" y="369.0">Segue</text><text class="s" x="480.0" y="385.0">continuous mix radio</text>
<path class="ln" d="M184,122 L214,122 L214,22 L620,22 L620,38" marker-end="url(#a)"/>
<path class="ln" d="M184,222 L238,222" marker-end="url(#a)"/>
<path class="ln" d="M460,175 L498,175" marker-end="url(#a)"/>
<path class="ln" d="M740,175 L778,175" marker-end="url(#a)"/>
<path class="ln dash" d="M350,310 L350,372 L398,372" marker-end="url(#a)"/>
<text class="l" x="300" y="340">sound data</text>
<path class="ln dash" d="M560,372 L620,372 L620,312" marker-end="url(#a)"/>
<text class="l" x="672" y="340">plays, ratings</text>
</svg>